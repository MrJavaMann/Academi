<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Academie">
    <title>Academie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, sans-serif;
            background-image: url('photo.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-sizing: border-box;
            overflow: hidden;
            padding-top: calc(40px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .brand-header {
            text-align: center;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .brand-header h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            font-size: 14px;
            margin-top: 4px;
            opacity: 0.85;
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .glass-slider {
            width: 85vw;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 5px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15), 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .glass-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 0;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
            border-radius: 40px;
            transition: color 0.3s ease;
        }

        .glass-btn span.icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .glass-btn:active {
            color: #007aff;
        }

        .liquid-fill {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 5px;
            width: calc((100% - 10px) / 3);
            border-radius: 40px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.25));
            box-shadow: inset 0 3px 5px rgba(255, 255, 255, 0.6), inset 0 -3px 5px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(255, 255, 255, 0.3);
            z-index: 0;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            will-change: transform;
        }

        #btn-1:active ~ .liquid-fill { transform: translateX(0); }
        #btn-2:active ~ .liquid-fill { transform: translateX(100%); }
        #btn-3:active ~ .liquid-fill { transform: translateX(200%); }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>Academie</h1>
        <p>Campus Safety & Student Hub</p>
    </div>

    <main>
        <div class="glass-slider">
            <a href="call.html" class="glass-btn" id="btn-1">
                <span class="icon">🩺</span>
                <span>PASS</span>
            </a>
            <a href="bus.html" class="glass-btn" id="btn-2">
                <span class="icon">🚌</span>
                <span>BUS</span>
            </a>
            <a href="map.html" class="glass-btn" id="btn-3">
                <span class="icon">🗺️</span>
                <span>MAP</span>
            </a>
            <div class="liquid-fill"></div>
        </div>
    </main>

</body>
</html>
