<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Office Calls</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            background-image: url('photo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            box-sizing: border-box;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 16px;
            border-radius: 20px;
            align-self: flex-start;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .pass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            color: #000000;
        }
        .pass-item {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pass-info h4 {
            margin: 0;
            font-size: 16px;
        }
        .pass-info p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #666666;
        }
        .tag {
            background: #34c759;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">‹ Home</a>

    <div class="pass-card">
        <h2>Active Call Slips</h2>
        <p>Passes issued by facility staff or the health office.</p>

        <div class="pass-item">
            <div class="pass-info">
                <h4>Nurse's Office</h4>
                <p>Scheduled Medication • 1:15 PM</p>
            </div>
            <span class="tag">READY</span>
        </div>

        <div class="pass-item">
            <div class="pass-info">
                <h4>Counseling Dept.</h4>
                <p>Academic Check-in • 2:30 PM</p>
            </div>
            <span class="tag" style="background:#007aff;">PENDING</span>
        </div>
    </div>
</body>
</html>
